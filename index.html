<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>Find Your Perfect Photographer</h1>
      <p>Explore talented photographers from Grafisch Lyceum Rotterdam and support their projects.</p>

      <div class="buttons">
        <button class="btn light">View Featured Photographers</button>
        <button class="btn dark">Start Searching</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h2>Featured Photographers</h2>
      <p>Check out the profiles of some of our amazing photographers.</p>

      <div class="cards">
        <div class="card">
          <div class="image"></div>
          <h3>Brian van Dijk</h3>
          <span>€200</span>
        </div>

        <div class="card">
          <div class="image"></div>
          <h3>Sarah Jansen</h3>
          <span>€250</span>
        </div>

        <div class="card">
          <div class="image"></div>
          <h3>Maya Hoek</h3>
          <span>€300</span>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2023 Creative Crowdfunding</p>
  </footer>
</body>
</html>
